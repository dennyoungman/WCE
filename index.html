<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#18211a"/>
<title>White Collar Escape</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172018;touch-action:none;font-family:Georgia,serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#rotate{display:none;position:fixed;inset:0;background:#1b241c;color:#f6e4ba;z-index:30;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}
@media (orientation:portrait){#rotate{display:flex}}
#joyBase{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:rgba(20,20,20,.25);border:3px solid rgba(255,255,255,.22);z-index:10;touch-action:none}
#joyKnob{position:absolute;left:32px;top:32px;width:52px;height:52px;border-radius:50%;background:rgba(244,217,165,.9);border:3px solid #6f4b2e;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#action{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:#e5b85d;border:5px solid #704522;color:#392716;font:bold 17px Georgia;z-index:10;box-shadow:0 5px 0 #4c321e;touch-action:none}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:7px;z-index:9}
.tool{width:60px;height:60px;border-radius:12px;border:3px solid #704522;background:#e3c184;color:#392716;font:bold 10px Georgia;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #4b321f;touch-action:none}
.tool.active{background:#fff0b8;transform:translateY(-5px)}
.tool .ico{font-size:23px;line-height:23px}
#msg{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 42px));transform:translateX(-50%);max-width:68vw;padding:9px 15px;border-radius:12px;background:rgba(247,223,174,.96);border:3px solid #704522;color:#392716;font:bold 14px Georgia;text-align:center;z-index:8;opacity:0;transition:opacity .18s}
#msg.show{opacity:1}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Rotate your iPhone to landscape.<br><br>White Collar Escape is designed as a landscape mobile game.</div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="hotbar">
<button class="tool active" data-tool="0"><span class="ico">⛏️</span>HOE</button>
<button class="tool" data-tool="1"><span class="ico">💧</span>WATER</button>
<button class="tool" data-tool="2"><span class="ico">🌱</span>SEEDS</button>
<button class="tool" data-tool="3"><span class="ico">🧺</span>HAND</button>
</div>
<button id="action">USE</button>
<div id="msg"></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
const TILE=48,COLS=34,ROWS=24,WORLD={w:COLS*TILE,h:ROWS*TILE};
const SAVE_KEY='wce-mobile-v3';
let state={player:{x:13.5*TILE,y:12*TILE,vx:0,vy:0,face:'down'},day:1,mins:490,money:18420,energy:100,waterFixed:false,met:false,tool:0,plots:{},inv:{seeds:12,tomato:0}};
try{const s=localStorage.getItem(SAVE_KEY);if(s)state=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}};
let dpr=1,VW=innerWidth,VH=innerHeight,zoom=1,cam={x:0,y:0};
function resize(){dpr=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;c.width=Math.round(VW*dpr);c.height=Math.round(VH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);zoom=Math.max(.92,Math.min(1.22,VH/430));}addEventListener('resize',resize);resize();
const sx=x=>(x-cam.x)*zoom,sy=y=>(y-cam.y)*zoom;
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(sx(x)),Math.round(sy(y)),Math.ceil(w*zoom),Math.ceil(h*zoom))}
function C(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx(x),sy(y),r*zoom,0,Math.PI*2);ctx.fill()}
function T(s,x,y,size=16,col='#3c2918',align='left'){ctx.fillStyle=col;ctx.font=`bold ${size*zoom}px Georgia`;ctx.textAlign=align;ctx.fillText(s,sx(x),sy(y))}
function SR(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function ST(s,x,y,size=16,col='#3c2918',align='left'){ctx.fillStyle=col;ctx.font=`bold ${size}px Georgia`;ctx.textAlign=align;ctx.fillText(s,x,y)}
const tx=x=>Math.floor(x/TILE),ty=y=>Math.floor(y/TILE),center=n=>n*TILE+TILE/2;
const key=(x,y)=>x+','+y;
const farm={x:13,y:10,w:9,h:7};
const blocked=new Set();
function blockRect(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)blocked.add(key(i,j))}
blockRect(3,3,9,5); blockRect(2,12,3,2); blockRect(25,11,6,5);
function isBlockedTile(x,y){if(x<0||y<3||x>=COLS||y>=ROWS-1)return true;return blocked.has(key(x,y))}
function tree(gx,gy){let x=center(gx),y=center(gy);R(x-8,y+6,16,65,'#684427');C(x,y-8,42,'#4f773d');C(x-22,y-2,24,'#718d48');C(x+23,y-14,22,'#647f42')}
function drawGround(){R(0,0,WORLD.w,WORLD.h,'#9fb464');for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){let n=((i*97+j*43)%13)/13;if(n>.63)R(i*TILE,j*TILE,TILE,TILE,n>.84?'#a9bd6b':'#a3b864')}R(0,0,WORLD.w,3*TILE,'#6abecf');R(0,0,WORLD.w,44,'#91d8df');for(let i=0;i<40;i++)R((i*79)%WORLD.w,58+(i*21)%55,32,2,'#bce8e4');R(0,3*TILE-12,WORLD.w,18,'#d1b47b')}
function drawFarmhouse(){R(3*TILE,3*TILE,9*TILE,5*TILE,'#d8c08f');R(2.8*TILE,2.75*TILE,9.4*TILE,.7*TILE,'#b85c32');R(3.7*TILE,2.35*TILE,7.6*TILE,.7*TILE,'#c96a37');R(4.5*TILE,5.4*TILE,1.5*TILE,2.6*TILE,'#477080');R(8.4*TILE,5.4*TILE,1.5*TILE,2.6*TILE,'#71482b');T('CASA BIANCA',7.5*TILE,4.4*TILE,17,'#73502d','center')}
function drawWell(){R(2*TILE,12*TILE,3*TILE,1.2*TILE,'#a7865b');R(2.3*TILE,11.5*TILE,2.4*TILE,1.2*TILE,'#c5a875');R(2.7*TILE,11.8*TILE,1.6*TILE,.6*TILE,'#4d7c91');T(state.waterFixed?'WELL ✓':'BROKEN WELL',3.5*TILE,13.6*TILE,12,'#49331f','center')}
function crop(gx,gy,p){let x=center(gx),y=center(gy);if(p.stage===0){R(x-4,y-4,8,12,'#5e8d3c')}else if(p.stage>0){R(x-4,y-15,8,22,'#4e8138');if(p.stage>1)C(x+7,y-9,6,'#d34f35')}}
function drawField(){R(farm.x*TILE,farm.y*TILE,farm.w*TILE,farm.h*TILE,'#8c5b32');for(let j=0;j<farm.h;j++)for(let i=0;i<farm.w;i++){let gx=farm.x+i,gy=farm.y+j,p=state.plots[key(gx,gy)];R(gx*TILE+3,gy*TILE+3,TILE-6,TILE-6,p?'#75502f':'#9d6938');if(p)crop(gx,gy,p)}}
function drawVillage(){R(27*TILE,8*TILE,12,82,'#76502f');R(26*TILE,7.7*TILE,115,47,'#d2b57b');T('VILLAGE →',27.2*TILE,8.3*TILE,13,'#52351f','center');R(27.6*TILE,12*TILE,17,30,'#315d7d');C(27.8*TILE,11.8*TILE,10,'#d2a06f');T('Giuseppe',27.8*TILE,11.35*TILE,12,'#392716','center');R(25*TILE,11*TILE,6*TILE,8,'#79502f');R(25*TILE,16*TILE,6*TILE,8,'#79502f');R(25*TILE,11*TILE,8,5*TILE,'#79502f');R(31*TILE-8,11*TILE,8,5*TILE,'#79502f');C(26.6*TILE,14.2*TILE,13,'#f4ead0');C(26.85*TILE,14.05*TILE,4,'#d84d35')}
function targetTile(){const p=state.player,gx=tx(p.x),gy=ty(p.y);if(p.face==='up')return{x:gx,y:gy-1};if(p.face==='down')return{x:gx,y:gy+1};if(p.face==='left')return{x:gx-1,y:gy};return{x:gx+1,y:gy}}
function drawTarget(){let t=targetTile();if(t.x<0||t.y<0||t.x>=COLS||t.y>=ROWS)return;ctx.save();ctx.strokeStyle='rgba(255,245,178,.95)';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.strokeRect(sx(t.x*TILE)+2,sy(t.y*TILE)+2,TILE*zoom-4,TILE*zoom-4);ctx.restore()}
function drawWorld(){drawGround();drawFarmhouse();[[2,7],[4,10],[28,5],[31,9],[6,18],[22,18]].forEach(v=>tree(...v));drawWell();drawField();drawVillage();R(0,21*TILE,WORLD.w,3*TILE,'#d4b16f');for(let i=0;i<WORLD.w;i+=90)R(i,22*TILE,54,5,'#c09a5c')}
function drawPlayer(t){const p=state.player,moving=Math.hypot(p.vx,p.vy)>.15,bob=moving?Math.sin(t*.016)*1.8:0,step=moving?Math.sin(t*.024)*4:0;ctx.save();ctx.globalAlpha=.22;C(p.x,p.y+20,13,'#1b2018');ctx.restore();C(p.x,p.y-16+bob,10,'#6a3d26');R(p.x-9,p.y-8+bob,18,26,'#ebe3d2');R(p.x-8,p.y+16+bob+step,7,16,'#355e77');R(p.x+2,p.y+16+bob-step,7,16,'#355e77');if(p.face==='left')R(p.x-13,p.y-3+bob,5,8,'#d4a06c');if(p.face==='right')R(p.x+8,p.y-3+bob,5,8,'#d4a06c');if(p.face==='up')R(p.x-7,p.y-26+bob,14,4,'#5a321f')}
function hud(){SR(14,12,188,63,'rgba(239,211,155,.94)');SR(214,12,145,38,'rgba(239,211,155,.94)');let h=Math.floor(state.mins/60)%24,m=Math.floor(state.mins%60).toString().padStart(2,'0');ST(`Spring · Day ${state.day}`,27,35,16);ST(`${String(h).padStart(2,'0')}:${m}`,27,58,16);ST(`€ ${state.money.toLocaleString()}`,286,38,16,'#392716','center');SR(VW-226,54,200,20,'rgba(73,59,40,.9)');SR(VW-222,58,1.9*Math.max(0,state.energy),12,'#8fba4c');ST(`Seeds ${state.inv.seeds}   Tomatoes ${state.inv.tomato}`,16,VH-10,12,'#fff')}
function msg(s){const el=document.getElementById('msg');el.textContent=s;el.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>el.classList.remove('show'),2200)}
function canUseTile(gx,gy){return Math.abs(tx(state.player.x)-gx)+Math.abs(ty(state.player.y)-gy)<=1}
function workTile(gx,gy){if(gx<farm.x||gx>=farm.x+farm.w||gy<farm.y||gy>=farm.y+farm.h)return false;let k=key(gx,gy),p=state.plots[k];if(state.tool===0&&!p){state.plots[k]={stage:-1,water:false};state.energy--;msg('Soil prepared.');save();return true}if(state.tool===2&&p&&p.stage===-1&&state.inv.seeds>0){p.stage=0;state.inv.seeds--;state.energy--;msg('Tomato seed planted.');save();return true}if(state.tool===1&&p&&p.stage>=0){if(!state.waterFixed){msg('Repair the well first.');return true}p.water=true;state.energy--;msg('Watered.');save();return true}if(state.tool===3&&p&&p.stage>=2){state.inv.tomato+=2;state.money+=4;delete state.plots[k];msg('Harvested 2 tomatoes. +€4');save();return true}return true}
function action(){let t=targetTile();if(workTile(t.x,t.y))return;if(Math.abs(t.x-3)<=1&&Math.abs(t.y-12)<=1){if(!state.waterFixed){state.waterFixed=true;state.money-=85;msg('Pump capacitor replaced. Water restored. −€85');save()}else msg('The well is working.');return}if(Math.hypot(state.player.x-27.8*TILE,state.player.y-12.3*TILE)<95){state.met=true;msg('Giuseppe: “The land is good. But do not trust the August sun.”');save();return}msg('Nothing to use here.')}
document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();moveTarget=null;action()});
[...document.querySelectorAll('.tool')].forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();state.tool=+b.dataset.tool;document.querySelectorAll('.tool').forEach(q=>q.classList.remove('active'));b.classList.add('active');save()}));
const base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');let joy={id:null,x:0,y:0};
function joyMove(e){let r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),lim=40;if(mag>lim){dx*=lim/mag;dy*=lim/mag}let nx=dx/lim,ny=dy/lim;if(Math.hypot(nx,ny)<.14){nx=ny=0}joy.x=nx;joy.y=ny;knob.style.transform=`translate(${dx}px,${dy}px)`;if(nx||ny)moveTarget=null}
base.addEventListener('pointerdown',e=>{joy.id=e.pointerId;base.setPointerCapture(e.pointerId);joyMove(e)});base.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e)});function joyEnd(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}}base.addEventListener('pointerup',joyEnd);base.addEventListener('pointercancel',joyEnd);
function collides(px,py){const r=10;let gx=tx(px),gy=ty(py+8);if(isBlockedTile(gx,gy))return true;return false}
function moveWithCollision(dx,dy){let p=state.player,nx=p.x+dx;if(!collides(nx,p.y))p.x=nx;let ny=p.y+dy;if(!collides(p.x,ny))p.y=ny}
let moveTarget=null,queuedAction=null;
function screenToWorld(x,y){return{x:x/zoom+cam.x,y:y/zoom+cam.y}}
c.addEventListener('pointerdown',e=>{if(e.clientY>VH-120)return;let w=screenToWorld(e.clientX,e.clientY),gx=tx(w.x),gy=ty(w.y);if(gx>=farm.x&&gx<farm.x+farm.w&&gy>=farm.y&&gy<farm.y+farm.h){if(canUseTile(gx,gy)){queuedAction=null;workTile(gx,gy)}else{let px=center(gx),py=center(gy);let dx=state.player.x-px,dy=state.player.y-py;if(Math.abs(dx)>Math.abs(dy))px+=dx>0?TILE: -TILE;else py+=dy>0?TILE:-TILE;moveTarget={x:px,y:py};queuedAction={x:gx,y:gy}}return}moveTarget={x:center(gx),y:center(gy)};queuedAction=null});
let last=performance.now(),saveTimer=0;
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;let p=state.player,inputX=joy.x,inputY=joy.y;if(!joy.x&&!joy.y&&moveTarget){let dx=moveTarget.x-p.x,dy=moveTarget.y-p.y,d=Math.hypot(dx,dy);if(d<8){p.vx*=.5;p.vy*=.5;moveTarget=null;if(queuedAction){let a=queuedAction;queuedAction=null;workTile(a.x,a.y)}}else{inputX=dx/d;inputY=dy/d}}
 const accel=1500,max=175,drag=10;if(inputX||inputY){let m=Math.hypot(inputX,inputY)||1;inputX/=m;inputY/=m;p.vx+=inputX*accel*dt;p.vy+=inputY*accel*dt;let sp=Math.hypot(p.vx,p.vy);if(sp>max){p.vx=p.vx/sp*max;p.vy=p.vy/sp*max}if(Math.abs(inputX)>Math.abs(inputY))p.face=inputX<0?'left':'right';else p.face=inputY<0?'up':'down'}else{p.vx*=Math.max(0,1-drag*dt);p.vy*=Math.max(0,1-drag*dt)}
 moveWithCollision(p.vx*dt,p.vy*dt);state.mins+=dt*2.8;if(state.mins>=1320){state.day++;state.mins=480;state.energy=100;Object.values(state.plots).forEach(q=>{if(q.water){q.water=false;if(q.stage>=0)q.stage=Math.min(2,q.stage+1)}});msg(`Day ${state.day}. Another hot Sicilian morning.`);save()}
 let targetCamX=p.x-VW/(2*zoom),targetCamY=p.y-VH/(2*zoom);targetCamX=Math.max(0,Math.min(WORLD.w-VW/zoom,targetCamX));targetCamY=Math.max(0,Math.min(WORLD.h-VH/zoom,targetCamY));cam.x+=(targetCamX-cam.x)*Math.min(1,8*dt);cam.y+=(targetCamY-cam.y)*Math.min(1,8*dt);saveTimer+=dt;if(saveTimer>5){saveTimer=0;save()}ctx.clearRect(0,0,VW,VH);drawWorld();drawTarget();drawPlayer(t);hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
msg('Stardew-style grid targeting is on: walk freely, interact one tile at a time.');
</script>
</body>
</html>
