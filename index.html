<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#18211a"/>
<title>White Collar Escape</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172018;touch-action:none;font-family:Georgia,serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#rotate{display:none;position:fixed;inset:0;background:#1b241c;color:#f6e4ba;z-index:30;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}@media(orientation:portrait){#rotate{display:flex}}
#joyBase{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:rgba(20,20,20,.25);border:3px solid rgba(255,255,255,.22);z-index:10}
#joyKnob{position:absolute;left:32px;top:32px;width:52px;height:52px;border-radius:50%;background:rgba(244,217,165,.9);border:3px solid #6f4b2e}
#action{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:#e5b85d;border:5px solid #704522;color:#392716;font:bold 17px Georgia;z-index:10;box-shadow:0 5px 0 #4c321e}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:7px;z-index:9}.tool{width:60px;height:60px;border-radius:12px;border:3px solid #704522;background:#e3c184;color:#392716;font:bold 10px Georgia}.tool.active{background:#fff0b8;transform:translateY(-5px)}.ico{font-size:23px;display:block}
#msg{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 42px));transform:translateX(-50%);max-width:68vw;padding:9px 15px;border-radius:12px;background:rgba(247,223,174,.96);border:3px solid #704522;color:#392716;font:bold 14px Georgia;text-align:center;z-index:8;opacity:0;transition:.18s}#msg.show{opacity:1}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Rotate your iPhone to landscape.<br><br>White Collar Escape is designed as a landscape mobile game.</div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="hotbar"><button class="tool active" data-tool="0"><span class="ico">⛏️</span>HOE</button><button class="tool" data-tool="1"><span class="ico">💧</span>WATER</button><button class="tool" data-tool="2"><span class="ico">🌱</span>SEEDS</button><button class="tool" data-tool="3"><span class="ico">🧺</span>HAND</button></div>
<button id="action">USE</button><div id="msg"></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
const TILE=48,WORLD={w:1632,h:1152};let VW=innerWidth,VH=innerHeight,dpr=1,zoom=1,cam={x:0,y:0};
let state={player:{x:650,y:590,vx:0,vy:0,face:'down'},day:1,mins:490,money:18420,energy:100,waterFixed:false,met:false,tool:0,plots:{},inv:{seeds:12,tomato:0}};
try{let s=localStorage.getItem('wce-free-v1');if(s)state=JSON.parse(s)}catch(e){}const save=()=>{try{localStorage.setItem('wce-free-v1',JSON.stringify(state))}catch(e){}};
function resize(){dpr=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;c.width=VW*dpr;c.height=VH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);zoom=Math.max(.92,Math.min(1.18,VH/430))}addEventListener('resize',resize);resize();
const sx=x=>(x-cam.x)*zoom,sy=y=>(y-cam.y)*zoom;function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(sx(x),sy(y),w*zoom,h*zoom)}function C(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx(x),sy(y),r*zoom,0,Math.PI*2);ctx.fill()}function T(s,x,y,z=16,col='#392716',a='left'){ctx.fillStyle=col;ctx.font=`bold ${z*zoom}px Georgia`;ctx.textAlign=a;ctx.fillText(s,sx(x),sy(y))}function SR(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function ST(s,x,y,z=16,col='#392716',a='left'){ctx.fillStyle=col;ctx.font=`bold ${z}px Georgia`;ctx.textAlign=a;ctx.fillText(s,x,y)}
function tree(x,y){R(x-8,y+12,16,70,'#684427');C(x,y,46,'#4f773d');C(x-23,y+3,26,'#718d48');C(x+24,y-10,23,'#647f42')}
const farm={x:620,y:480,w:432,h:288};
function crop(x,y,p){if(p.stage===0)R(x-4,y-3,8,12,'#5e8d3c');else if(p.stage>0){R(x-4,y-15,8,22,'#4e8138');if(p.stage>1)C(x+6,y-9,6,'#d34f35')}}
function drawWorld(){R(0,0,WORLD.w,WORLD.h,'#9fb464');for(let j=0;j<24;j++)for(let i=0;i<34;i++){let n=((i*97+j*43)%13)/13;if(n>.62)R(i*TILE,j*TILE,TILE,TILE,n>.84?'#a9bd6b':'#a3b864')}R(0,0,WORLD.w,132,'#6abecf');R(0,0,WORLD.w,44,'#91d8df');R(0,120,WORLD.w,18,'#d1b47b');
R(150,170,440,220,'#d8c08f');R(135,155,470,35,'#b85c32');R(190,135,360,38,'#c96a37');R(225,275,70,115,'#477080');R(410,275,72,115,'#71482b');T('CASA BIANCA',370,215,17,'#73502d','center');
[[90,295],[130,505],[1350,260],[1460,500],[1260,760],[300,810]].forEach(v=>tree(...v));
R(105,565,130,32,'#a7865b');R(120,530,100,50,'#c5a875');R(137,545,66,24,'#4d7c91');T(state.waterFixed?'WELL ✓':'BROKEN WELL',170,620,12,'#49331f','center');
R(farm.x,farm.y,farm.w,farm.h,'#8c5b32');for(let j=0;j<6;j++)for(let i=0;i<9;i++){let x=farm.x+i*48,y=farm.y+j*48,k=i+','+j,p=state.plots[k];R(x+3,y+3,42,42,p?'#75502f':'#9d6938');if(p)crop(x+24,y+24,p)}
R(1280,390,12,82,'#76502f');R(1230,378,115,47,'#d2b57b');T('VILLAGE →',1287,407,13,'#52351f','center');R(1330,548,17,30,'#315d7d');C(1338,540,10,'#d2a06f');T('Giuseppe',1338,522,12,'#392716','center');R(1160,555,300,8,'#79502f');R(1160,790,300,8,'#79502f');R(1160,555,8,243,'#79502f');R(1452,555,8,243,'#79502f');C(1245,710,13,'#f4ead0');C(1257,702,4,'#d84d35');R(0,900,WORLD.w,252,'#d4b16f')}
const blockers=[{x:135,y:150,w:470,h:245},{x:95,y:520,w:145,h:90},{x:1150,y:545,w:320,h:260}];function collides(x,y){let r=10;if(x<20||y<150||x>WORLD.w-20||y>WORLD.h-30)return true;for(const b of blockers)if(x+r>b.x&&x-r<b.x+b.w&&y+8>b.y&&y-8<b.y+b.h)return true;return false}function move(dx,dy){let p=state.player;if(!collides(p.x+dx,p.y))p.x+=dx;if(!collides(p.x,p.y+dy))p.y+=dy}
function targetTile(){let p=state.player,gx=Math.floor(p.x/TILE),gy=Math.floor((p.y+4)/TILE);if(p.face==='up')gy--;else if(p.face==='down')gy++;else if(p.face==='left')gx--;else gx++;return{gx,gy,x:gx*TILE,y:gy*TILE}}
function drawTarget(){let t=targetTile();ctx.save();ctx.strokeStyle='rgba(255,247,170,.98)';ctx.lineWidth=3;ctx.setLineDash([7,4]);ctx.strokeRect(sx(t.x)+2,sy(t.y)+2,TILE*zoom-4,TILE*zoom-4);ctx.fillStyle='rgba(255,245,170,.08)';ctx.fillRect(sx(t.x)+2,sy(t.y)+2,TILE*zoom-4,TILE*zoom-4);ctx.restore()}
function drawPlayer(t){let p=state.player,m=Math.hypot(p.vx,p.vy)>.5,b=m?Math.sin(t*.016)*1.7:0,s=m?Math.sin(t*.024)*4:0;ctx.save();ctx.globalAlpha=.22;C(p.x,p.y+20,13,'#1b2018');ctx.restore();C(p.x,p.y-16+b,10,'#6a3d26');R(p.x-9,p.y-8+b,18,26,'#ebe3d2');R(p.x-8,p.y+16+b+s,7,16,'#355e77');R(p.x+2,p.y+16+b-s,7,16,'#355e77')}
function hud(){SR(14,12,188,63,'rgba(239,211,155,.94)');SR(214,12,145,38,'rgba(239,211,155,.94)');let h=Math.floor(state.mins/60)%24,m=Math.floor(state.mins%60).toString().padStart(2,'0');ST(`Spring · Day ${state.day}`,27,35,16);ST(`${String(h).padStart(2,'0')}:${m}`,27,58,16);ST(`€ ${state.money.toLocaleString()}`,286,38,16,'#392716','center');SR(VW-226,54,200,20,'rgba(73,59,40,.9)');SR(VW-222,58,1.9*Math.max(0,state.energy),12,'#8fba4c')}
function msg(s){let e=document.getElementById('msg');e.textContent=s;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),2200)}
function farmCell(t){let wx=t.gx*TILE,wy=t.gy*TILE;if(wx<farm.x||wx>=farm.x+farm.w||wy<farm.y||wy>=farm.y+farm.h)return null;let i=Math.floor((wx-farm.x)/48),j=Math.floor((wy-farm.y)/48);return{i,j,k:i+','+j}}
function action(){let t=targetTile(),f=farmCell(t);if(f){let p=state.plots[f.k];if(state.tool===0&&!p){state.plots[f.k]={stage:-1,water:false};state.energy--;msg('Soil prepared.')}else if(state.tool===2&&p&&p.stage===-1&&state.inv.seeds>0){p.stage=0;state.inv.seeds--;state.energy--;msg('Tomato seed planted.')}else if(state.tool===1&&p&&p.stage>=0){if(!state.waterFixed)msg('Repair the well first.');else{p.water=true;state.energy--;msg('Watered.')}}else if(state.tool===3&&p&&p.stage>=2){state.inv.tomato+=2;state.money+=4;delete state.plots[f.k];msg('Harvested 2 tomatoes. +€4')}save();return}if(Math.hypot(state.player.x-170,state.player.y-565)<95){if(!state.waterFixed){state.waterFixed=true;state.money-=85;msg('Pump capacitor replaced. Water restored. −€85');save()}else msg('The well is working.');return}if(Math.hypot(state.player.x-1338,state.player.y-560)<95){state.met=true;msg('Giuseppe: “The land is good. But do not trust the August sun.”');save();return}msg('Nothing to use here.')}
document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});document.querySelectorAll('.tool').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();state.tool=+b.dataset.tool;document.querySelectorAll('.tool').forEach(q=>q.classList.remove('active'));b.classList.add('active');save()}));
const base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');let joy={id:null,x:0,y:0};function jm(e){let r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),lim=40;if(mag>lim){dx*=lim/mag;dy*=lim/mag}joy.x=dx/lim;joy.y=dy/lim;if(Math.hypot(joy.x,joy.y)<.12)joy.x=joy.y=0;knob.style.transform=`translate(${dx}px,${dy}px)`}base.addEventListener('pointerdown',e=>{joy.id=e.pointerId;base.setPointerCapture(e.pointerId);jm(e)});base.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)jm(e)});function je(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}}base.addEventListener('pointerup',je);base.addEventListener('pointercancel',je);
function face(dx,dy){if(Math.hypot(dx,dy)<.15)return;if(Math.abs(dx)>Math.abs(dy))state.player.face=dx<0?'left':'right';else state.player.face=dy<0?'up':'down'}
let last=performance.now(),sv=0;function loop(t){let dt=Math.min(.035,(t-last)/1000);last=t,p=state.player,ix=joy.x,iy=joy.y,mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}let max=155,dx=ix*max,dy=iy*max,blend=1-Math.exp(-((ix||iy)?13:18)*dt);p.vx+=(dx-p.vx)*blend;p.vy+=(dy-p.vy)*blend;if(Math.abs(p.vx)<.4)p.vx=0;if(Math.abs(p.vy)<.4)p.vy=0;face(p.vx,p.vy);move(p.vx*dt,p.vy*dt);let vw=VW/zoom,vh=VH/zoom,tx=Math.max(0,Math.min(WORLD.w-vw,p.x-vw/2)),ty=Math.max(0,Math.min(WORLD.h-vh,p.y-vh/2)),cf=1-Math.exp(-8*dt);cam.x+=(tx-cam.x)*cf;cam.y+=(ty-cam.y)*cf;state.mins+=dt*2.5;if(state.mins>=1320){state.day++;state.mins=480;state.energy=100;Object.values(state.plots).forEach(q=>{if(q.water){q.water=false;if(q.stage>=0)q.stage=Math.min(2,q.stage+1)}});save()}sv+=dt;if(sv>5){sv=0;save()}ctx.clearRect(0,0,VW,VH);drawWorld();drawTarget();drawPlayer(t);hud();requestAnimationFrame(loop)}requestAnimationFrame(loop);msg('Free movement restored. The square only shows your target tile.');
</script></body></html>
