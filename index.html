<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>White Collar Escape — Prototype</title>
<style>
html,body{margin:0;height:100%;background:#1f211b;font-family:Georgia,serif;overflow:hidden}
#game{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#f1d49a;border:3px solid #704522;padding:7px 12px;border-radius:7px;color:#392716;font:bold 14px Georgia;box-shadow:0 3px 0 #382817;pointer-events:none}
</style></head>
<body><canvas id="game"></canvas><div id="hint">WASD / arrows move · E interact · 1–4 select tool · click/tap adjacent soil</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'); x.imageSmoothingEnabled=false;
let W=1280,H=720; function resize(){c.width=W;c.height=H;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'} resize();
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(['1','2','3','4'].includes(e.key))tool=+e.key-1;if(e.key.toLowerCase()=='e')interact()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const tile=40, cols=32, rows=18;
let player={x:15.5,y:10.8,dir:0}, day=1, mins=8*60+10, money=18420, energy=100, waterFixed=false, met=false, msg="Day 1 — You arrived in Sicily. The well pump is broken.", msgT=420;
let tool=0, tools=["Hoe","Water","Seeds","Hands"], plots={}, inventory={seeds:12,tomato:0};
function noise(i,j){return ((i*928371+j*1237)%17)/17}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function txt(s,a,b,size=18,col="#3c2918",align="left"){x.fillStyle=col;x.font=`bold ${size}px Georgia`;x.textAlign=align;x.fillText(s,a,b)}
function ground(){
 rect(0,0,W,H,"#9eb35c");
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let n=noise(i,j); if(n>.55)rect(i*tile,j*tile,tile,tile,n>.8?"#a9bc66":"#a2b75f")}
 rect(0,0,W,105,"#70c5d4"); rect(0,0,W,38,"#92d7df");
 for(let i=0;i<40;i++)rect((i*83)%W,50+(i*29)%48,35,2,"#b8e4df");
 rect(0,104,W,18,"#d1b47b"); for(let i=0;i<W;i+=44)rect(i,108,34,8,"#ad8b5c");
 rect(120,130,360,185,"#d5bd8a"); rect(105,120,390,28,"#b55c32"); rect(140,100,320,35,"#c76a38");
 rect(180,215,60,100,"#477080"); rect(340,215,62,100,"#6d492e"); rect(267,170,55,48,"#5f8a99"); rect(275,178,39,32,"#d8c179"); txt("CASA BIANCA",300,155,17,"#72502f","center");
 for(const [tx,ty] of [[2,5],[5,9],[27,5],[29,9]]) tree(tx,ty);
 rect(70,430,110,28,"#a7865b"); rect(82,400,86,45,"#c5a875"); rect(94,412,62,24,"#4d7c91"); txt(waterFixed?"WELL ✓":"BROKEN WELL",125,475,12,"#4b3523","center");
 rect(470,345,430,285,"#8c5b32");
 for(let j=0;j<6;j++)for(let i=0;i<9;i++){let k=`${i},${j}`;let p=plots[k];rect(480+i*46,355+j*43,38,35,p?"#76502f":"#9d6938"); if(p)crop(499+i*46,372+j*43,p)}
 rect(0,635,W,85,"#d4b16f"); for(let i=0;i<W;i+=80)rect(i,665,50,5,"#c09a5c");
 rect(1015,300,12,80,"#76502f"); rect(970,290,105,45,"#d2b57b"); txt("VILLAGE →",1022,318,13,"#52351f","center"); npc(1080,510);
 rect(930,410,260,8,"#79502f");rect(930,590,260,8,"#79502f");rect(930,410,8,188,"#79502f");rect(1182,410,8,188,"#79502f"); chicken(1010,550);
}
function tree(tx,ty){let px=tx*tile,py=ty*tile;rect(px+16,py+30,18,70,"#6d4728");x.fillStyle="#567b38";x.beginPath();x.arc(px+25,py+25,48,0,7);x.fill();x.fillStyle="#728f43";x.beginPath();x.arc(px+5,py+15,30,0,7);x.fill()}
function crop(px,py,p){if(p.stage==0){rect(px-3,py-2,6,8,"#5e8d3c")}else{rect(px-4,py-14,8,20,"#4e8138"); if(p.stage>1){x.fillStyle="#d34f35";x.beginPath();x.arc(px+5,py-8,5,0,7);x.fill()}}}
function npc(px,py){rect(px-8,py-18,16,28,"#315d7d");x.fillStyle="#d2a06f";x.beginPath();x.arc(px,py-25,9,0,7);x.fill();txt("Giuseppe",px,py-40,12,"#392716","center")}
function chicken(px,py){x.fillStyle="#f4ead0";x.beginPath();x.ellipse(px,py,15,11,0,0,7);x.fill();x.fillStyle="#d84d35";x.beginPath();x.arc(px+13,py-8,4,0,7);x.fill()}
function drawPlayer(){let px=player.x*tile,py=player.y*tile; x.fillStyle="#6a3d26";x.beginPath();x.arc(px,py-15,10,0,7);x.fill();rect(px-9,py-7,18,26,"#e8e0cf");rect(px-8,py+18,7,15,"#355e77");rect(px+2,py+18,7,15,"#355e77")}
function ui(){
 rect(14,14,245,88,"#f0d49c"); x.strokeStyle="#704522";x.lineWidth=4;x.strokeRect(14,14,245,88); txt(`Spring · Day ${day}`,30,44,20); let hr=Math.floor(mins/60)%24,mm=Math.floor(mins%60).toString().padStart(2,'0');txt(`${String(hr).padStart(2,'0')}:${mm}`,30,76,22);
 rect(275,14,190,48,"#f0d49c");x.strokeRect(275,14,190,48);txt(`€ ${money.toLocaleString()}`,370,46,20,"#392716","center"); rect(1045,18,210,28,"#493b28");rect(1050,23,2*energy,18,"#8fba4c");txt("ENERGY",1038,40,11,"#fff","right");
 let bx=390; for(let i=0;i<4;i++){rect(bx+i*105,650,96,55,i==tool?"#fff0bf":"#e5c183");x.strokeStyle="#704522";x.lineWidth=3;x.strokeRect(bx+i*105,650,96,55);txt(`${i+1} ${tools[i]}`,bx+i*105+48,683,14,"#392716","center")}
 txt(`Seeds ${inventory.seeds}   Tomatoes ${inventory.tomato}`,22,695,15,"#fff"); if(msgT>0){rect(260,110,760,52,"rgba(242,218,168,.96)");x.strokeStyle="#704522";x.strokeRect(260,110,760,52);txt(msg,640,143,17,"#3c2918","center");msgT--}
}
function interact(){let dx=player.x-2.9,dy=player.y-10.8;if(Math.hypot(dx,dy)<2.2&&!waterFixed){waterFixed=true;money-=85;msg="You replaced the pump capacitor. Water restored. -€85";msgT=300;return} if(Math.hypot(player.x-27,player.y-12.7)<2.2&&!met){met=true;msg="Giuseppe: ‘The land is good. But don't trust the August sun.’";msgT=360;return}}
function fieldAction(mx,my){let i=Math.floor((mx-480)/46),j=Math.floor((my-355)/43);if(i<0||i>8||j<0||j>5)return;let cx=(499+i*46)/tile,cy=(372+j*43)/tile;if(Math.hypot(player.x-cx,player.y-cy)>2.1){msg="Too far away.";msgT=100;return}let k=`${i},${j}`,p=plots[k];if(tool==0&&!p){plots[k]={stage:-1,water:false,age:0};energy-=1}else if(tool==2&&p&&p.stage==-1&&inventory.seeds>0){p.stage=0;inventory.seeds--;energy-=1}else if(tool==1&&p&&p.stage>=0){if(!waterFixed){msg="No water. Repair the well first.";msgT=150}else{p.water=true;energy-=1}}else if(tool==3&&p&&p.stage>=2){inventory.tomato+=2;delete plots[k];money+=4;msg="Harvested tomatoes. Local value: €4.";msgT=120}}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;fieldAction(mx,my)});
let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;let sp=3.4*dt,dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.x=Math.max(.4,Math.min(31.5,player.x+dx*sp));player.y=Math.max(3.2,Math.min(16.5,player.y+dy*sp));mins+=dt*2.5;if(mins>=22*60){day++;mins=8*60;energy=100;for(let p of Object.values(plots)){if(p.water){p.age++;p.water=false;if(p.stage>=0)p.stage=Math.min(2,p.stage+1)}}msg=`Day ${day}. The Sicilian sun is already up.`;msgT=220}ground();drawPlayer();ui();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
